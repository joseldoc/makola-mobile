         Blocking on purpose, and tiny; a file rather than inline code, so that a
         future Content-Security-Policy needs no hash or 'unsafe-inline'.

         `inlineCritical: false`): the inlined critical CSS left out the
         `[data-mk-theme]` rules, and the page was white until the rest loaded. -->
